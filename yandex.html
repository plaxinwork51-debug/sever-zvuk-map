<head>

<title>Карта заведений Мурманска · Северный Звук</title>
<script src="https://api-maps.yandex.ru/v3/?apikey=38cb1619-0e6d-42cf-a1f3-3d57a04e550a&lang=ru_RU"></script>
<style>
  :root{ --bg:#0A0B0D; --panel:#15171A; --line:#262B31; --ink:#EAF0F6; --muted:#8A93A0; --cyan:#48C8FF; }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);}
  #map{position:absolute;inset:0;background:var(--bg);}

  .hdr{position:absolute;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;gap:16px;
       padding:12px 18px;background:linear-gradient(180deg,rgba(10,11,13,.96),rgba(10,11,13,.74) 75%,transparent);
       pointer-events:none;}
  .hdr .logo{height:42px;pointer-events:auto;}
  .hdr .ttl{display:flex;flex-direction:column;}
  .hdr .ttl b{font-size:17px;letter-spacing:.4px;line-height:1.15;}
  .hdr .ttl span{font-size:12px;color:var(--muted);}
  .hdr .sp{flex:1;}
  .hdr .links{display:flex;gap:7px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end;}
  .hdr .links a{font-size:12px;text-decoration:none;color:var(--ink);background:rgba(72,200,255,.10);
       border:1px solid rgba(72,200,255,.35);padding:5px 12px;border-radius:20px;transition:.15s;white-space:nowrap;}
  .hdr .links a:hover{background:var(--cyan);color:#06121a;border-color:var(--cyan);}

  .legend{position:absolute;bottom:46px;left:14px;z-index:1000;background:rgba(21,23,26,.92);
          border:1px solid var(--line);border-radius:14px;padding:11px 13px;backdrop-filter:blur(6px);}
  .legend .ttl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:7px;}
  .legend .row{display:flex;align-items:center;gap:9px;padding:4px 2px;cursor:pointer;font-size:13px;transition:.15s;}
  .legend .row.off{opacity:.32;}
  .legend .chip{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;background:#0e1013;flex:none;}

  .credit{position:absolute;bottom:10px;left:14px;z-index:1000;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:7px;}
  .credit b{color:var(--cyan);font-weight:600;}

  .sz-pin{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
          font-size:15px;background:#0e1013;border:2.5px solid #fff;box-shadow:0 3px 9px rgba(0,0,0,.6);
          cursor:pointer;transform:translate(-50%,-50%);transition:transform .12s;}
  .sz-pin:hover{transform:translate(-50%,-50%) scale(1.18);}

  /* карточка заведения */
  .card{position:absolute;z-index:1100;left:50%;bottom:64px;transform:translateX(-50%);width:330px;max-width:92vw;
        background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px 16px;
        box-shadow:0 14px 40px rgba(0,0,0,.6);display:none;}
  .card.show{display:block;}
  .card .x{position:absolute;top:10px;right:12px;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;}
  .card .cat{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;padding:2px 9px;border-radius:20px;margin-bottom:6px;}
  .card .name{font-size:17px;font-weight:700;margin:2px 0;padding-right:18px;}
  .card .addr{font-size:12px;color:var(--muted);margin-bottom:8px;}
  .card .desc{font-size:13px;line-height:1.5;}
  .card .links{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;}
  .card .links a{font-size:11px;text-decoration:none;background:rgba(72,200,255,.10);color:var(--cyan);padding:3px 10px;border-radius:20px;border:1px solid rgba(72,200,255,.30);}
  .card .links a:hover{background:var(--cyan);color:#06121a;}

  .yandex-error{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
        color:var(--muted);font-size:15px;padding:40px;z-index:5;}
  @media(max-width:680px){.hdr .ttl span{display:none;} .hdr .links a{padding:4px 9px;}}
</style>
</head>

u570GjMcu3GB19fJW4DPwcItpD/vftaKolwAVa/w+Vh59Hho09tgAAAABJRU5ErkJggg=="};
const CATS = D.cats, MARKERS = D.markers;

// ссылки СЗ в шапке
const lk = document.getElementById('szlinks');
D.links.forEach(([t,u])=>{const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';a.textContent=t;lk.appendChild(a);});

const card = document.getElementById('card');
function showCard(m){
  const [label,color,emoji]=CATS[m.cat];
  const links=m.links.map(l=>`<a href="${l[1]}" target="_blank" rel="noopener">${l[0]}</a>`).join('');
  card.innerHTML=`<span class="x" onclick="document.getElementById('card').classList.remove('show')">✕</span>
    <div class="cat" style="background:${color}22;color:${color}">${emoji} ${label}</div>
    <div class="name">${m.name}</div>
    <div class="addr">📍 ${m.addr}</div>
    <div class="desc">${m.desc}</div>
    <div class="links">${links}</div>`;
  card.classList.add('show');
}

const markerEls = {}; // cat -> [el]
for(const k in CATS) markerEls[k]=[];

async function initMap(){
  await ymaps3.ready;
  const {YMap, YMapDefaultSchemeLayer, YMapDefaultFeaturesLayer, YMapMarker, YMapControls} = ymaps3;
  const err = document.getElementById('err'); if(err) err.remove();

  const map = new YMap(document.getElementById('map'), {
    location: {center:[33.082, 68.965], zoom:11.5},
    theme:'dark'
  }, [ new YMapDefaultSchemeLayer(), new YMapDefaultFeaturesLayer() ]);

  // зум-контролы (если пакет доступен)
  try{
    const {YMapZoomControl} = await ymaps3.import('@yandex/ymaps3-controls@0.0.1');
    map.addChild(new YMapControls({position:'right'}).addChild(new YMapZoomControl({})));
  }catch(e){ /* жесты всё равно работают */ }

  MARKERS.forEach(m=>{
    const [label,color,emoji]=CATS[m.cat];
    const el=document.createElement('div');
    el.className='sz-pin'; el.style.borderColor=color; el.textContent=emoji;
    el.title=m.name;
    el.addEventListener('click',(ev)=>{ ev.stopPropagation(); showCard(m); });
    markerEls[m.cat].push(el);
    map.addChild(new YMapMarker({coordinates:[m.lon, m.lat]}, el));
  });

  // легенда-фильтр
  const legend=document.getElementById('legend');
  for(const k in CATS){
    const [label,color,emoji]=CATS[k];
    const row=document.createElement('div');row.className='row';
    row.innerHTML=`<span class="chip" style="border:2px solid ${color}">${emoji}</span><span>${label}</span>`;
    row.onclick=()=>{
      const off=row.classList.toggle('off');
      markerEls[k].forEach(el=>{ el.style.display = off ? 'none' : 'flex'; });
    };
    legend.appendChild(row);
  }
}

if(window.ymaps3){ initMap(); }
else { document.getElementById('err').innerHTML='Не удалось загрузить API Яндекс.Карт.<br><small>Проверьте API-ключ.</small>'; }
</script>
